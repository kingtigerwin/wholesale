plugins {
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'java'
}

ext {
	mapstructVersion = '1.6.3'
	jjwtVersion = '0.13.0'
	restAssuredVersion = '6.0.0'
}

group = 'com.anz'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {

	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'

	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'

	implementation "org.mapstruct:mapstruct:${mapstructVersion}"
	annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

	implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
}

// Black-box tests against the app and Postgres started from docker-compose.it.yaml.
// Run with: ./gradlew integrationTest (requires Docker)
testing {
	suites {
		integrationTest(JvmTestSuite) {
			useJUnitJupiter()
			dependencies {
				implementation 'org.testcontainers:testcontainers'
				implementation 'org.testcontainers:testcontainers-junit-jupiter'
				implementation "io.rest-assured:rest-assured:${restAssuredVersion}"
				runtimeOnly 'org.postgresql:postgresql'
				implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
				runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
				runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"
			}
			targets.configureEach {
				testTask.configure {
					// Dockerfile_Dev copies build/libs/wholesale-<version>.jar into the app image
					dependsOn tasks.named('bootJar')
					shouldRunAfter tasks.named('test')
				}
			}
		}
	}
}
