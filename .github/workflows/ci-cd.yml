name: CI/CD

# Replaces the former AWS CodeBuild/CodePipeline setup (buildspec.yml).
#  - Pull requests to master: build, unit tests, integration tests.
#  - Pushes to master: the same, then build and push the image to ECR and deploy it to ECS.
#    The deploy job is skipped until the AWS_ROLE_ARN repository variable is set.
#
# Deploy configuration lives in GitHub, not in this file:
#  - Repository variables: AWS_ROLE_ARN, ECS_CLUSTER, ECS_SERVICE, ECS_TASK_DEFINITION
#  - Environment "production" (optional protection rules, e.g. required reviewers)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: wholesale
  CONTAINER_NAME: accountQuery

jobs:
  build:
    name: Build and unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and run unit tests
        run: ./gradlew build

      # The tested jar is what the deploy job packages into the image (see Dockerfile).
      - name: Upload application jar
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: build/libs/wholesale-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7

      - name: Upload unit test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: build/reports/tests/test

  integration-test:
    name: Integration test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # Starts the app and Postgres from docker-compose.it.yaml via Testcontainers (Docker is preinstalled on the runner).
      - name: Run integration tests
        run: ./gradlew integrationTest

      - name: Upload integration test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-report
          path: build/reports/tests/integrationTest

  deploy:
    name: Deploy to ECS
    needs: [build, integration-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write   # OIDC: assume the AWS role without storing access keys
    steps:
      - uses: actions/checkout@v7

      - name: Download application jar
        uses: actions/download-artifact@v8
        with:
          name: app-jar
          path: build/libs

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Starts from the task definition currently registered in ECS, so only the image changes.
      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ vars.ECS_TASK_DEFINITION }}" \
            --query taskDefinition > task-definition.json

      - name: Point task definition at the new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy to ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          wait-for-service-stability: true
